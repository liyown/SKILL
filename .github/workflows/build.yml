name: Build Skills Registry

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local registry
        run: ./scripts/validate.sh

      - name: Validate shadcn registry
        run: npx shadcn@latest registry validate

      - name: Build artifacts
        run: ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills-registry
          path: |
            dist/registry.json
            dist/items/*.json
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
