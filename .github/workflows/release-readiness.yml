name: release-readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: offline structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run smoke + examples + validate
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate.sh

  dry-run-release:
    name: release dry-run
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release.sh needs tag history

      - name: Run release dry-run
        shell: bash
        run: |
          set -euo pipefail
          # Dry-run prints the "would run" preview and exits 0
          # without creating a tag. If it ever changes to do real
          # work, the printed output will be different and a human
          # reviewer will catch the change in the PR.
          ./scripts/release.sh --dry-run

      - name: Verify dry-run was idempotent
        shell: bash
        run: |
          set -euo pipefail
          # Capture the tag list before and after, assert no new tag
          # was created by the dry-run above.
          before=$(git tag --points-at HEAD 2>/dev/null || true)
          ./scripts/release.sh --dry-run > /dev/null 2>&1
          after=$(git tag --points-at HEAD 2>/dev/null || true)
          if [ "$before" != "$after" ]; then
            echo "FAIL: dry-run mutated the tag list at HEAD"
            echo "  before: $before"
            echo "  after:  $after"
            exit 1
          fi
          echo "ok: dry-run was idempotent (no tag list mutation)"
