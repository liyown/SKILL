name: release-readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: offline structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run smoke + examples + validate
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/validate.sh

  dry-run-release:
    name: release dry-run
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release.sh needs tag history

      - name: Run release dry-run
        shell: bash
        run: |
          set -euo pipefail
          # Dry-run prints the "would run" preview and exits 0
          # without creating a tag. A regression that changes the
          # dry-run to do real work will show up as a different
          # PR diff for the script itself.
          ./scripts/release.sh --dry-run
